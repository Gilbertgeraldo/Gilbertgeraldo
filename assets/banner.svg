<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">ALDO — Gilbert Geraldo</title>
  <desc id="desc">Machine Learning Engineer. Data, algorithms, and intelligent systems. A cyan neural network on a dark grid.</desc>
  <defs>
