<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">ALDO — Gilbert Geraldo, Machine Learning Engineer</title>
  <desc id="bannerDesc">Dark banner. On the left: the wordmark ALDO, the role Machine Learning Engineer, Data Science at Telkom University, the tagline "Data, algorithms, and intelligent systems", and the tags Go, Python, C++ and Algorithms. On the right: an animated four-layer neural network labelled input, hidden and output, with signals travelling from left to right.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset=".55" stop-color="#0E1725"/>
      <stop offset="1" stop-color="#101E30"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset=".18" stop-color="#22D3EE"/>
      <stop offset=".62" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset=".5" stop-color="#A5F3FC" stop-opacity=".95"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="wordmark" x1="60" y1="110" x2="380" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9FB8CE"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop stop-color="#0891B2" stop-opacity=".22"/>
      <stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreGlow">
      <stop stop-color="#22D3EE" stop-opacity=".55"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#94A3B8" stroke-opacity=".05"/>
    </pattern>

    <clipPath id="card">
      <rect x="1" y="1" width="1198" height="398" rx="24"/>
    </clipPath>

    <style><![CDATA[
      .f { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .m { font-family: "Cascadia Code", Consolas, "SF Mono", Menlo, monospace; }

      @keyframes sweep   { 0% { transform: translateX(-400px); } 100% { transform: translateX(1280px); } }
      @keyframes flow    { from { stroke-dashoffset: 520; } to { stroke-dashoffset: 0; } }
      @keyframes ping    { 0% { r: 15; opacity: .5; } 70%, 100% { r: 33; opacity: 0; } }
      @keyframes pingLg  { 0% { r: 19; opacity: .6; } 70%, 100% { r: 42; opacity: 0; } }
      @keyframes beat    { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes drift   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes blink   { 0%, 45% { opacity: 1; } 55%, 100% { opacity: 0; } }
      @keyframes twinkle { 0%, 100% { opacity: .12; } 50% { opacity: .5; } }

      .sweep { animation: sweep 5.5s cubic-bezier(.5,0,.5,1) infinite; }
      .net   { animation: drift 7s ease-in-out infinite; }
      .caret { animation: blink 1.1s step-end infinite; }

      .sig   { stroke-dasharray: 26 494; animation: flow 3.2s linear infinite; }
      .sig-b { animation-delay: 1.1s; }
      .sig-c { animation-delay: 2.1s; }

      .ping    { animation: ping 3.4s ease-out infinite; }
      .ping-lg { animation: pingLg 3.4s ease-out infinite; }
      .p2 { animation-delay: .85s } .p3 { animation-delay: 1.7s } .p4 { animation-delay: 2.55s }

      .beat { animation: beat 2.6s ease-in-out infinite; }
      .b2 { animation-delay: .5s } .b3 { animation-delay: 1s }
      .star { animation: twinkle 4s ease-in-out infinite; }
      .s2 { animation-delay: 1.3s } .s3 { animation-delay: 2.6s } .s4 { animation-delay: .7s }

      @media (prefers-reduced-motion: reduce) {
        .sweep, .net, .caret, .sig, .ping, .ping-lg, .beat, .star {
          animation: none !important;
        }
        .sweep, .ping, .ping-lg { opacity: 0; }
      }
    ]]></style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>
    <ellipse cx="960" cy="200" rx="360" ry="310" fill="url(#halo)"/>

    <g fill="#67E8F9">
      <circle class="star" cx="512" cy="92" r="1.6"/>
      <circle class="star s2" cx="596" cy="318" r="2"/>
      <circle class="star s3" cx="468" cy="246" r="1.4"/>
      <circle class="star s4" cx="640" cy="148" r="1.8"/>
      <circle class="star s2" cx="1160" cy="96" r="1.6"/>
      <circle class="star s3" cx="680" cy="366" r="1.5"/>
    </g>

    <rect y="0" width="1200" height="3" fill="url(#accent)"/>
    <rect class="sweep" y="0" width="400" height="3" fill="url(#sweepGrad)"/>

    <g class="f">
      <g>
        <circle cx="66" cy="58" r="4" fill="#22D3EE"/>
        <circle class="beat" cx="66" cy="58" r="8" fill="none" stroke="#22D3EE" stroke-width="1"/>
        <text x="86" y="63" fill="#94A3B8" font-size="13" font-weight="600" letter-spacing="3.4">GILBERT GERALDO</text>
      </g>

      <text x="58" y="190" fill="url(#wordmark)" font-size="118" font-weight="800" letter-spacing="-6">ALDO<tspan fill="#22D3EE">.</tspan></text>

      <text x="62" y="232" fill="#E6EDF3" font-size="27" font-weight="600" letter-spacing="-.2">Machine Learning Engineer</text>
      <text x="62" y="262" fill="#7FD9E8" font-size="16" font-weight="500">Data Science @ Telkom University</text>

      <g>
        <text x="62" y="292" fill="#8B98A9" font-size="15">Data, algorithms, and intelligent systems.</text>
        <rect class="caret" x="350" y="280" width="7" height="16" fill="#22D3EE"/>
      </g>

      <path d="M62 316H430" stroke="#22394D"/>

      <g>
        <g fill="#0E1B29" stroke="#1F3A4D">
          <rect x="62" y="336" width="52" height="28" rx="8"/>
          <rect x="124" y="336" width="92" height="28" rx="8"/>
          <rect x="226" y="336" width="58" height="28" rx="8"/>
          <rect x="294" y="336" width="136" height="28" rx="8"/>
        </g>
        <g fill="#67E8F9" font-size="12" font-weight="700" letter-spacing="1.6" text-anchor="middle">
          <text x="88" y="354">GO</text>
          <text x="170" y="354">PYTHON</text>
          <text x="255" y="354">C++</text>
          <text x="362" y="354">ALGORITHMS</text>
        </g>
      </g>

      <text x="1136" y="63" text-anchor="end" fill="#64748B" font-size="12" font-weight="600" letter-spacing="2.6">BANDUNG · INDONESIA</text>
    </g>

    <g class="net">
      <g stroke="#22D3EE" stroke-width="1.1" stroke-opacity=".14">
        <path d="M720 130L850 100M720 130L850 167M720 130L850 233M720 130L850 300M720 200L850 100M720 200L850 167M720 200L850 233M720 200L850 300M720 270L850 100M720 270L850 167M720 270L850 233M720 270L850 300"/>
        <path d="M850 100L980 100M850 100L980 167M850 100L980 233M850 100L980 300M850 167L980 100M850 167L980 167M850 167L980 233M850 167L980 300M850 233L980 100M850 233L980 167M850 233L980 233M850 233L980 300M850 300L980 100M850 300L980 167M850 300L980 233M850 300L980 300"/>
        <path d="M980 100L1110 200M980 167L1110 200M980 233L1110 200M980 300L1110 200"/>
      </g>

      <path d="M660 200H702M1128 200H1170" stroke="#22D3EE" stroke-opacity=".32" stroke-dasharray="3 5"/>

      <g fill="none" stroke-linecap="round" stroke-opacity=".28" stroke-width="1.6">
        <path d="M720 200L850 233L980 167L1110 200" stroke="#22D3EE"/>
        <path d="M720 130L850 100L980 233L1110 200" stroke="#38BDF8"/>
        <path d="M720 270L850 300L980 300L1110 200" stroke="#22D3EE"/>
      </g>

      <g fill="none" stroke-linecap="round" stroke-width="2.6">
        <path class="sig" d="M720 200L850 233L980 167L1110 200" stroke="#A5F3FC"/>
        <path class="sig sig-b" d="M720 130L850 100L980 233L1110 200" stroke="#7DD3FC"/>
        <path class="sig sig-c" d="M720 270L850 300L980 300L1110 200" stroke="#A5F3FC"/>
      </g>

      <g fill="none" stroke="#22D3EE">
        <circle class="ping" cx="720" cy="200" r="15"/>
        <circle class="ping p2" cx="850" cy="233" r="15"/>
        <circle class="ping p3" cx="980" cy="167" r="15"/>
        <circle class="ping-lg p4" cx="1110" cy="200" r="19"/>
      </g>

      <g fill="#0F2232" stroke="#2F7287" stroke-width="1.5">
        <circle cx="720" cy="130" r="15"/><circle cx="720" cy="200" r="15"/><circle cx="720" cy="270" r="15"/>
        <circle cx="850" cy="100" r="15"/><circle cx="850" cy="167" r="15"/><circle cx="850" cy="233" r="15"/><circle cx="850" cy="300" r="15"/>
        <circle cx="980" cy="100" r="15"/><circle cx="980" cy="167" r="15"/><circle cx="980" cy="233" r="15"/><circle cx="980" cy="300" r="15"/>
      </g>

      <circle cx="1110" cy="200" r="46" fill="url(#coreGlow)"/>
      <circle cx="1110" cy="200" r="19" fill="#0F2232" stroke="#38BDF8" stroke-width="2"/>

      <g fill="#22D3EE">
        <circle class="beat" cx="720" cy="200" r="5"/>
        <circle class="beat b2" cx="850" cy="233" r="5"/>
        <circle class="beat b3" cx="980" cy="167" r="5"/>
        <circle cx="1110" cy="200" r="7.5" fill="#67E8F9"/>
      </g>

      <g fill="#31586C">
        <circle cx="720" cy="130" r="4"/><circle cx="720" cy="270" r="4"/>
        <circle cx="850" cy="100" r="4"/><circle cx="850" cy="167" r="4"/><circle cx="850" cy="300" r="4"/>
        <circle cx="980" cy="100" r="4"/><circle cx="980" cy="233" r="4"/><circle cx="980" cy="300" r="4"/>
      </g>
    </g>

    <g class="m" fill="#5C7085" font-size="11" letter-spacing="1.8" text-anchor="middle">
      <text x="720" y="352">INPUT</text>
      <text x="915" y="352">HIDDEN</text>
      <text x="1110" y="352">OUTPUT</text>
    </g>
  </g>

  <rect x=".5" y=".5" width="1199" height="399" rx="24" stroke="#223044"/>
</svg>
